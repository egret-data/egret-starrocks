name: build

on:
  push:
    branches: [main]
    tags: ["*-egret.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('UPSTREAM') }}
          restore-keys: m2-

      # The thrift compiler must match the libthrift the FE builds against (fe/pom.xml thrift.version,
      # 0.24.0 on 4.1.7): Ubuntu's thrift-compiler 0.19 generates code that does not compile against it.
      # Version and checksum are the ones in the tag's thirdparty/vars.sh.
      - name: Cache thrift compiler
        id: thrift-cache
        uses: actions/cache@v4
        with:
          path: ~/thrift
          key: thrift-0.24.0-${{ runner.os }}

      - name: Build thrift compiler 0.24.0
        if: steps.thrift-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bison flex g++ make
          curl -fsSL -o /tmp/thrift.tar.gz https://archive.apache.org/dist/thrift/0.24.0/thrift-0.24.0.tar.gz
          echo "232e035ff80c5fb4b7243f0be3a76b02  /tmp/thrift.tar.gz" | md5sum -c -
          tar -xzf /tmp/thrift.tar.gz -C /tmp
          cd /tmp/thrift-0.24.0
          ./configure --prefix="$HOME/thrift" --disable-libs --disable-tests --disable-tutorial
          make -j"$(nproc)" && make install

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          echo "$HOME/thrift/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: thrift -version && protoc --version && java -version

      - name: Apply patches
        run: scripts/apply.sh

      - name: Build FE jars
        run: scripts/build-fe.sh

      - name: Build AuditLoader
        run: scripts/build-auditloader.sh

      - name: Build images
        run: REGISTRY=ghcr.io/${{ github.repository_owner }} scripts/build-images.sh

      - name: Security e2e
        run: |
          source UPSTREAM
          tests/e2e/run.sh "ghcr.io/${{ github.repository_owner }}/egret-starrocks-allin1:${UPSTREAM_TAG}-egret.${EGRET_PATCH_LEVEL}"

      - name: Push images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source UPSTREAM
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for kind in fe allin1; do
            docker push "ghcr.io/${{ github.repository_owner }}/egret-starrocks-${kind}:${UPSTREAM_TAG}-egret.${EGRET_PATCH_LEVEL}"
          done
